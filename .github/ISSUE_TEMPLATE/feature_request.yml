name: Feature request
description: Suggest a change to Taskseq.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private deployment details, or personal task data.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the task or limitation that prompted this request.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe how Taskseq should behave.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add examples or alternatives that may help evaluate the request.
